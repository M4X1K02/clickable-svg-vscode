<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #333;
        }
        .panzoom-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #555;
        }
        .panzoom-stage svg {
            max-width: 100%;
            max-height: 100%;
            display: block;
            background: #777;
        }
    </style>
</head>
<body>
    <div id="svg-container">
        <div class="panzoom-stage">
            <svg width="200" height="200" viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="50" fill="red" />
            </svg>
        </div>
    </div>
    <script>
        const stage = document.querySelector('.panzoom-stage');
        console.log('stage size:', stage.getBoundingClientRect());
    </script>
</body>
</html>
